<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Rounded Teal Background Box -->
    <rect width="512" height="512" rx="96" fill="#005b6e"/>

    <!-- Subtle Subway Tile Grid Lines -->
    <g stroke="#ffffff" stroke-width="6" stroke-opacity="0.18" stroke-linecap="round">
        <!-- Horizontal Grout Lines -->
        <line x1="30" y1="130" x2="482" y2="130" />
        <line x1="30" y1="256" x2="482" y2="256" />
        <line x1="30" y1="382" x2="482" y2="382" />

        <!-- Vertical Offset Joints (Subway Pattern) -->
        <!-- Row 1 & 3 Joints -->
        <line x1="170" y1="30" x2="170" y2="130" />
        <line x1="342" y1="30" x2="342" y2="130" />
        <line x1="170" y1="256" x2="170" y2="382" />
        <line x1="342" y1="256" x2="342" y2="382" />

        <!-- Row 2 & 4 Staggered Joints -->
        <line x1="85" y1="130" x2="85" y2="256" />
        <line x1="256" y1="130" x2="256" y2="256" />
        <line x1="427" y1="130" x2="427" y2="256" />
        <line x1="85" y1="382" x2="85" y2="482" />
        <line x1="256" y1="382" x2="256" y2="482" />
        <line x1="427" y1="382" x2="427" y2="482" />
    </g>

    <!-- Gold Crown Graphic -->
    <g fill="none" stroke="#d49a18" stroke-width="28" stroke-linejoin="round" stroke-linecap="round">
        <!-- Main Crown Body -->
        <path d="M 120,330 L 145,190 L 210,260 L 256,155 L 302,260 L 367,190 L 392,330 Z" />
        <!-- Crown Base Bar -->
        <line x1="120" y1="375" x2="392" y2="375" />
    </g>
</svg>
